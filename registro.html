<!DOCTYPE html>
<html lang="es">
    <link rel="stylesheet" href="registro.css">
    <head>
        <meta charset="UTF-8"> <!-- Define la codificación de caracteres como UTF-8 -->
        <title>registro</title> <!-- Título que aparece en la pestaña del navegador -->
        <!--<link rel="stylesheet" href="styles.css">  Vincula la hoja de estilos-->
    </head>
    <body>
    <div class="registro-box">
        <h1>registro de TO DO LIST en Node</h1>
        <p>ingrese los siguientes datos</p>
        
        <p>Usuario:</p>
        <input type="text" id="usname" placeholder="Ingrese su nombre de usuario">

        <p>Correo:</p>
        <input type="email" id="Correo" placeholder="Ingrese su correo electrónico">

        <p>Pin:</p>
        <input type="password" id="pin" placeholder="Ingrese su pin">

        <button onclick="registrar()">registrarme</button>

        <h1 id="respuesta"></h1>
    </div>
</body>
</html>
